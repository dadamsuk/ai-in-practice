background: |
  You use an AI assistant most days. You paste in management accounts and board-pack drafts and ask it to
  find inconsistencies between the narrative and the numbers; you always tie its findings back to the
  ledger yourself, because in February it confidently "found" a variance that was really a mapping error
  in its own reading of the table. You stopped using it to write variance commentary from scratch: it
  was fluent but generic.
  Last year you sponsored and wrote the business case for automated invoice matching in accounts payable
  (a vendor tool with a machine-learning matching engine). You set the success measure before buying:
  touchless match rate up from about 55% to 80% within six months, with exceptions still reviewed by a
  person over a £5k threshold. It reached roughly 74%, and you kept the human review threshold after the
  auditors asked how the matching rules were controlled.
  Your team of nine uses AI unevenly. You ran one lunchtime session and shared your prompts for
  reconciling intercompany balances, but you have not set expectations or measured adoption; two people
  use it daily, the rest rarely.
  A year ago you thought AI was mostly hype for finance; the invoice-matching result changed your view,
  though you remain cautious about anything that touches reported numbers.

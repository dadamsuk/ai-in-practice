background: |
  You use an AI assistant now and then, mostly to tidy up emails and to summarise long supplier contracts
  before a renewal. You don't give it much context and you skim the result rather than check it properly.
  Last year your IT manager trialled an AI route-planning add-on in one depot for six weeks. You approved the
  trial and asked for fuel cost per drop as the measure; it fell by about 4%, but drivers complained the
  routes ignored loading-bay times, and the trial was not extended. You were not closely involved in how it
  was set up.
  You have not done anything yet to change how your managers use AI; it has not come up in your operations
  meetings.
  You are open-minded: you think the route-planning trial failed because of poor set-up rather than the idea,
  and you want to try again with drivers involved from the start.

background: |
  Experimentation is tightly limited: no customer data may go into external AI tools, and any model used in
  a customer outcome needs model-risk sign-off and an explanation the regulator would accept (Consumer Duty).
  Personal use is limited by policy to an approved internal assistant with no internet access; you use it
  occasionally to summarise policy documents and board papers, and you check anything that will be relied on.
  You led the case for an AI tool that triages incoming mortgage-servicing emails into queues (no decisions
  about customers). You insisted on a three-month shadow run where staff checked every classification:
  accuracy reached 93%, average handling time fell by about 15%, and the vulnerable-customer flag always goes
  to a person. You turned down a vendor's proposal for automated affordability decisions because it could not
  explain individual outcomes.
  You set up an AI working group with risk, compliance and operations, and a register of every AI use case
  with an owner; 11 cases are on it, 3 live. Staff training is mandatory before access to the internal assistant.
  You believe the constraints are right for a mutual, and that the useful work is in operations, not lending decisions.

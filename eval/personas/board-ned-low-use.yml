background: |
  You deliberately use AI very little yourself. You tried an assistant for summarising board packs for two
  months and stopped: the summaries dropped the caveats in the risk papers, which are what you most need to
  read. You still use it occasionally to check your understanding of unfamiliar technical terms before a
  meeting, and you treat the answer as a starting point, not a source.
  As audit committee chair you asked management last year which AI tools touched the financial close and who
  had tested them. They could not answer fully; as a result an inventory of AI use was produced and internal
  audit now includes AI controls in its plan, starting with the AI-assisted cost forecasting on sites.
  You pushed for a board session on AI that was run by the CTO with real examples, not a vendor, and you now
  ask for a short AI risk update in each audit committee pack.
  You think AI is useful for the business but that boards must be able to see where it is used and how it is checked.

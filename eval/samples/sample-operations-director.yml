# A made-up person for the sample report (#724, `mix eval.sample`). Not part
# of the evaluation set: the people, company and events here are fictional.
id: sample-operations-director
role_group: operations
seniority: Operations director
sector: Garden furniture maker (fictional, "Fernhill Outdoor")
company_size: About 220 people, one factory and a warehouse
language: Native English speaker
style: Friendly and practical. Three or four sentences, with a concrete example when there is one.
levels:
  understanding: developing
  personal_use: capable
  applying_to_business: capable
  leading_adoption: developing
  attitude: capable
background: |
  You use an AI assistant most days. You draft supplier emails and shift-pattern proposals with it, and you
  paste in the context first: the supplier's last three emails, or the rota rules. You check anything with a
  number in it against the spreadsheet, because it once got a delivery date wrong.
  You know these tools predict text rather than look things up, and that they can sound sure when they are
  wrong, but you are vague on how they are trained or what happens to what you paste in.
  This spring you ran a twelve-week pilot in the warehouse: an AI tool reads incoming purchase orders from
  email and drafts the order entries for a person to approve. You picked the measure before you started,
  minutes per order keyed in, and it fell from about six to two. Mis-keyed orders also fell. You kept the
  approval step because two orders a week still need a human to read the customer's note.
  You have shown your two warehouse team leaders how to use the assistant, and you wrote a one-page note on
  what may and may not be pasted into it. You have not yet found a way to get the factory supervisors
  interested; two of them think it is a fad.
  You are keen but not starry-eyed: you think it saves real time on paperwork and want to try it on
  maintenance scheduling next, but you would not let it decide anything about people's shifts on its own.
